name: Deploy to GitHub Pages

on:
  push:
    branches: [main, staging]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Build production (main)
      # data.json is committed alongside lrs.sqlite — no export step needed in CI
      - run: npm run build
      - run: mkdir -p _site && cp -r dist/* _site/

      # MAINTENANCE MODE — the public root serves main's static maintenance page.
      # This step exists on BOTH main and staging on purpose: Actions runs the workflow
      # file of the branch that was pushed, and from 2026-06-25 to 2026-09-22 pushes to
      # staging rebuilt the root WITHOUT this step, putting the unaudited app back online
      # while everyone believed the site was down. maintenance.html comes from the
      # `ref: main` checkout above. To bring the live site back, remove this step from
      # both branches in the same change.
      - run: test -f maintenance.html && cp maintenance.html _site/index.html && cp maintenance.html _site/404.html

      # Build staging
      - uses: actions/checkout@v4
        with:
          ref: staging
          clean: false
          path: _staging_src
      - run: cd _staging_src && npm ci && npx vite build --base /lrs-dashboard/staging/
      - run: mkdir -p _site/staging && cp -r _staging_src/dist/* _site/staging/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
